<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRSLV | В разработке</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      padding: 44px 32px;
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      text-decoration: none;
      color: #f8fafc;
      background: #334155;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn:hover {
      background: #475569;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">
      <span class="dot"></span> В разработке
    </div>
    <h1>krslv.ru</h1>
    <p>Здесь скоро появится новый проект. Заходите позже или свяжитесь со мной напрямую.</p>
    <div class="links">
      <a href="mailto:e.krslv@mail.ru" class="btn">Написать на почту</a>
      <a href="https://t.me/" target="_blank" class="btn">Telegram</a>
    </div>
  </div>
</body>
</html>
